sudo: required
dist: jammy
addons:
  chrome: stable
  apt:
    packages:
      - openjdk-17-jdk
language: node_js
git:
  depth: 3
node_js:
  - "22"
  - "24"
before_install:
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version
  - rvm use "$(cat .ruby-version)" --install --fuzzy
  - gem install bundler --version 2.6.9 --no-document
  - npm install -g npm@11.17.0
install:
  - bundle config set --local deployment true
  - bundle install --jobs=3 --retry=3
  - npm ci
before_script:
  - bundle exec bundler-audit check --update
  - bundle exec ruby build/test-ruby-docs.rb
  - npm run test-build-compat
after_success:
  - if [ "$TRAVIS_REPO_SLUG" = twbs-savage/bootstrap ]; then npm run docs-upload-preview; fi
stages:
  - test
  - name: browser
    if: type = push
jobs:
  include:
    - stage: browser
      node_js: 22
      script: if ! git log --format=%B --no-merges -n 1 | grep '\[skip browser\]'; then npm test && npm run js-test-cloud; fi
cache:
  directories:
    - node_modules
    - vendor/bundle
